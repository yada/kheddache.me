[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# www redirects to the apex. The Netlify subdomain stays reachable on purpose (fallback; canonical tag points to kheddache.me)
[[redirects]]
  from = "https://www.kheddache.me/*"
  to = "https://kheddache.me/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Agent-friendly content: Markdown copy of the page and llms.txt (see netlify/edge-functions/markdown.ts)
[[headers]]
  for = "/"
  [headers.values]
    Vary = "Accept"
    Link = "</index.md>; rel=\"alternate\"; type=\"text/markdown\", </llms.txt>; rel=\"describedby\"; type=\"text/plain\""

[[headers]]
  for = "/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
